<h2>Ajouter un article</h2>
<mat-dialog-content>
    <input matInput [(ngModel)]="newItemName" placeholder="Nom de l'article" />
    <input matInput [(ngModel)]="newItemNumber" type="number"/>
</mat-dialog-content>
<mat-dialog-actions>
    <button (click)="addItem()" mat-dialog-close>Ajouter</button>
    <button (click)="cancel()" mat-dialog-close>Annuler</button>
</mat-dialog-actions>
