<h2>Ajouter un article</h2>
<mat-dialog-content>
    <form [formRoot]="addForm">
    <div class="addInput">
        <label>Nom de l'article
        <input type="text" [formField]="addForm.name" placeholder="Nom de l'article"/>
        </label>
    </div>
    
    <div class="addInput">
    <label>Quantité
      <input type="number" [formField]="addForm.quantity" id="quantity"/>
    </label>
    </div>

    <div class="buttonDiv" mat-dialog-close>
    <button type="submit">
      <span class="shadow"></span>
      <span class="edge"></span>
      <div class="front">
        <span>Ajouter</span>
      </div>
    </button>
    </div>
    
    </form>
</mat-dialog-content>

<mat-dialog-actions>
    <div class="buttonDiv">
        <button (click)="cancel()" mat-dialog-close>
            <span class="shadow"></span>
            <span class="edge"></span>
            <div class="front">
                <span>Annuler</span>
            </div>
        </button>
    </div>
    
</mat-dialog-actions>
