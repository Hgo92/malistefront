<div class="item-card" [class.archived]="item.isArchived">
  <button class="delete-btn" *ngIf="item.isArchived" (click)="onDelete($event)">
    ✕
  </button>

  <div class="item-main" (click)="item.isArchived ? onAttach() : onDetach()">
    <span class="item-name">{{ item.name }}</span>
  </div>

  <div class="quantity-controls">
    <button (click)="onMinus($event)">-</button>
    <span class="quantity-value">{{ item.quantity }}</span>
    <button (click)="onPlus($event)">+</button>
  </div>
</div>
