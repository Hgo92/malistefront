<div>
  <h2>Créer mon compte</h2>
  <form [formRoot]="registerForm">
    <label>Nom
      <input type="text" [formField]="registerForm.username" placeholder="Nom d'utilisateur"/>
    </label>
    <label>Mot de passe
      <input type="password" [formField]="registerForm.password" placeholder="Mot de passe"/>
    </label>

    <div class="buttonDiv">
    <button type="submit">
      <span class="shadow"></span>
      <span class="edge"></span>
      <div class="front">
        <span>S'inscrire</span>
      </div>
    </button>
    
    <button (click)="onCancel()">
      <span class="shadow"></span>
      <span class="edge"></span>
      <div class="front">
        <span>Annuler</span>
      </div>
    </button>
  </div>
  
</form>


</div>
