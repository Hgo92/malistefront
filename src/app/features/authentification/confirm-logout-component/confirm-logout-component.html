<h2>Voulez-vous vous déconnecter ?</h2>
<mat-dialog-actions>
    <button matButton mat-dialog-close (click)="onLogout()"><span class="shadow"></span>
      <span class="edge"></span>
      <div class="front">
        <span>Me déconnecter</span>
      </div></button>
    <button matButton mat-dialog-close>
        <span class="shadow"></span>
        <span class="edge"></span>
        <div class="front">
            <span>Annuler</span>
        </div>
    </button>
</mat-dialog-actions>
